<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создать новый пост</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="top-nav">
        <a href="{{ url_for('index') }}" class="btn-link">← На главную</a>
    </div>

    <div class="blog-container">
        <div class="card form-card">
            <h1 class="form-title">Новая публикация</h1>
            <form method="POST">
                <div class="form-group">
                    <label for="title">Заголовок</label>
                    <input type="text" id="title" name="title" placeholder="Придумайте яркое название..." required autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="content">Текст поста</label>
                    <textarea id="content" name="content" rows="8" placeholder="Поделитесь своими мыслями..." required></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-submit">Опубликовать</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
